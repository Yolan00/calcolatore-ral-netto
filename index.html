<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcolatore RAL → Netto — 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Calcolatore RAL → Netto</h1>
    <p class="sottotitolo">
      Anno d'imposta 2026 — dipendente privato a tempo indeterminato, residente a Milano (Lombardia).
    </p>

    <form id="calcolatore">
      <p>
        <label for="ral">RAL — retribuzione annua lorda (€)</label>
        <input type="number" id="ral" name="ral" min="1" step="any" required>
      </p>
      <p>
        <label for="mensilita">Mensilità</label>
        <select id="mensilita" name="mensilita"></select>
      </p>
      <p><button type="submit">Calcola</button></p>
    </form>

    <section id="risultato" aria-live="polite"></section>

    <footer>
      <p>
        Prototipo. Parametri, fonti normative e limiti noti nel
        <a href="https://github.com/Yolan00/calcolatore-ral-netto">repository</a>.
      </p>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
