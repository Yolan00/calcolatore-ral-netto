<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calcolatore RAL → Netto — 2026</title>
</head>
<body>
  <main>
    <h1>Calcolatore RAL → Netto</h1>
    <p>Anno d'imposta 2026 — dipendente privato a tempo indeterminato, residente a Milano (Lombardia).</p>

    <form id="calcolatore">
      <p>
        <label for="ral">RAL — retribuzione annua lorda (€)</label><br>
        <input type="number" id="ral" name="ral" min="1" step="any" required>
      </p>
      <p>
        <label for="mensilita">Mensilità</label><br>
        <select id="mensilita" name="mensilita"></select>
      </p>
      <button type="submit">Calcola</button>
    </form>

    <section id="risultato" aria-live="polite"></section>

    <p><small>Step 6 di 10: collegamento fra form e motore. Il dettaglio impaginato arriva al passo successivo.</small></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
